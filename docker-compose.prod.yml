# Canlı ortam. Dışarıya yalnızca Caddy açıktır (80/443).
# API, Next.js ve Redis yalnızca Docker iç ağında çalışır.
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    depends_on: [web, api]

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
        NEXT_PUBLIC_API_URL: https://api.${DOMAIN}
    restart: unless-stopped
    networks: [edge]

  api:
    build: ./api
    restart: unless-stopped
    env_file: .env
    environment:
      CORS_ORIGINS: https://${DOMAIN}
      REDIS_URL: redis://redis:6379/0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [edge, internal]
    depends_on: [redis]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    networks: [internal]

networks:
  edge:
  internal:
    internal: true   # internete çıkışı yok, yalnızca api erişir

volumes:
  caddy_data:
  caddy_config:
