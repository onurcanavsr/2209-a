<!-- "Reset password" | Konu: Parola yenileme bağlantınız -->
<h2>Parolanızı yenileyin</h2>
<p>Parolanızı yenilemek için aşağıdaki bağlantıya tıklayın:</p>
<p><a href="{{ .SiteURL }}/auth/callback?token_hash={{ .TokenHash }}&type=recovery&next=/parola-yenile">Yeni parola belirle</a></p>
<p>Bu isteği siz yapmadıysanız bu e-postayı yok sayın, parolanız değişmez.</p>
